<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e2e5">
  <meta name="description" content="绒爪选物 · 宠物发饰、项圈与配件商品目录。">
  <title>绒爪选物 · 商品目录</title>
  <link rel="icon" href="assets/store-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="announcement"><span>绒爪选物 · PAW ATELIER</span><span>宠物发饰与配件</span></div>

  <header class="site-header">
    <a class="identity" href="#/products" aria-label="绒爪选物商品首页">
      <img id="brandLogo" src="assets/store-mark.svg" alt="绒爪选物">
      <span class="identity-caption">PET RIBBON &amp; ACCESSORIES</span>
    </a>

    <nav class="desktop-nav" aria-label="主导航">
      <a href="#/products" data-nav="products">商品 <small id="catalogCount"></small></a>
      <a href="#/cart" data-nav="cart">购物车 <b class="cart-count" data-cart-count hidden>0</b></a>
    </nav>

    <label class="search-box">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜索商品、规格或分类" aria-label="搜索商品、规格或分类">
      <button id="clearSearch" type="button" aria-label="清空搜索" hidden>×</button>
    </label>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div>
      <img src="assets/store-mark.svg" alt="绒爪选物">
      <p>为小小的它，挑一件刚刚好的装饰。</p>
    </div>
  </footer>

  <nav class="mobile-nav" aria-label="移动端导航">
    <a href="#/products" data-nav="products"><span class="nav-symbol">✦</span><em>商品</em><small id="mobileCatalogCount"></small></a>
    <a href="#/cart" data-nav="cart"><span class="nav-symbol">♡</span><em>购物车</em><b class="cart-count" data-cart-count hidden>0</b></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
