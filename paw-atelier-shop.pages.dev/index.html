<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e2e5">
  <meta id="metaDescription" name="description" content="绒爪选物 · 宠物发饰、项圈与配件商品目录。">
  <title>绒爪选物 · 商品目录</title>
  <link rel="icon" href="assets/store-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260918-header-pixel1">
</head>
<body>
  <div class="announcement"><span>绒爪选物 · PAW ATELIER</span><span id="announcementType">宠物发饰与配件</span></div>

  <header class="site-header">
    <a class="identity" id="brandHome" href="#/products" aria-label="绒爪选物商品首页">
      <img id="brandLogo" src="assets/store-mark.svg" alt="绒爪选物">
      <span class="identity-caption" id="identityCaption">PET RIBBON &amp; ACCESSORIES</span>
    </a>

    <nav class="desktop-nav" aria-label="主导航">
      <a href="#/products" data-nav="products"><span id="navProductsLabel">商品</span> <small id="catalogCount"></small></a>
      <a href="#/cart" data-nav="cart"><span id="navCartLabel">心愿单</span> <b class="cart-count" data-cart-count hidden>0</b></a>
    </nav>

    <div class="header-tools">
      <div class="language-switcher" id="languageSwitcher" role="group" aria-label="语言切换">
        <button class="language-button active" type="button" data-language="zh" aria-pressed="true">中文</button>
        <span aria-hidden="true">/</span>
        <button class="language-button" type="button" data-language="ja" aria-pressed="false">日本語</button>
      </div>
      <label class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索商品、规格或分类" aria-label="搜索商品、规格或分类">
        <button id="clearSearch" type="button" aria-label="清空搜索" hidden>×</button>
      </label>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div>
      <img src="assets/store-mark.svg" alt="绒爪选物">
      <p id="footerTagline">为小小的它，挑一件刚刚好的装饰。</p>
    </div>
  </footer>

  <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航">
    <a href="#/products" data-nav="products"><span class="nav-symbol">✦</span><em id="mobileProductsLabel">商品</em><small id="mobileCatalogCount"></small></a>
    <a href="#/cart" data-nav="cart"><span class="nav-symbol">♡</span><em id="mobileCartLabel">心愿单</em><b class="cart-count" data-cart-count hidden>0</b></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=20260919-name-zh1"></script>
</body>
</html>
